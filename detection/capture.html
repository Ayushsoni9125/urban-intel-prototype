<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Urban Intel — Live Camera</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 2px solid #2c5282;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .logo span { color: #f0f6fc; }

    #status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      transition: all 0.3s;
    }
    #status-pill.active {
      background: #0d4429;
      border-color: #238636;
      color: #3fb950;
    }
    #status-pill.error {
      background: #4d1212;
      border-color: #f85149;
      color: #f85149;
    }

    .video-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    video#cam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas#snapshot { display: none; }

    .overlay-hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      pointer-events: none;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #58a6ff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .detection-flash {
      position: absolute;
      inset: 0;
      border: 5px solid #f85149;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }
    .detection-flash.show { opacity: 1; }

    .bottom-panel {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #f0f6fc;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .stat-value.alert-red { color: #f85149; }

    .stat-label {
      font-size: 10px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    .btn-row {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #btn-start {
      background: #238636;
      color: #fff;
    }
    #btn-start:active { background: #2ea043; }
    #btn-start:disabled { background: #21262d; color: #8b949e; cursor: default; }

    #btn-stop {
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    #btn-stop:not(:disabled):active { background: #b62324; color: #fff; }
    #btn-stop:disabled { cursor: default; }

    .gps-display {
      text-align: center;
      font-size: 10px;
      color: #8b949e;
      margin-top: 10px;
      font-family: monospace;
      letter-spacing: 0.03em;
    }

    .gps-display span { color: #58a6ff; }

    #log-feed {
      max-height: 80px;
      overflow-y: auto;
      font-size: 10px;
      color: #8b949e;
      font-family: monospace;
      margin-top: 10px;
      padding: 6px 10px;
      background: #0d1117;
      border-radius: 6px;
      border: 1px solid #21262d;
    }

    .log-entry { line-height: 1.6; }
    .log-entry.pothole { color: #f85149; font-weight: 600; }
    .log-entry.duplicate { color: #e3b341; font-weight: 600; }

    /* Toast popup */
    #toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 999;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.type-duplicate {
      background: #2d2a00;
      border: 1px solid #e3b341;
      color: #e3b341;
    }
    #toast.type-saved {
      background: #0d4429;
      border: 1px solid #3fb950;
      color: #3fb950;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Urban <span>Intel</span> — Live Cam</div>
  <div id="status-pill">IDLE</div>
</header>

<div class="video-container">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="snapshot"></canvas>
  <div class="detection-flash" id="flash"></div>
  <div class="overlay-hud">
    <div class="hud-row">
      <span id="hud-mode">CAMERA OFF</span>
      <span id="hud-time">--:--</span>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast"></div>

<div class="bottom-panel">
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="stat-frames">0</div>
      <div class="stat-label">Frames Sent</div>
    </div>
    <div class="stat-card">
      <div class="stat-value alert-red" id="stat-potholes">0</div>
      <div class="stat-label">Potholes Found</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-duplicates" style="color:#e3b341">0</div>
      <div class="stat-label">Already Reported</div>
    </div>
  </div>

  <div class="btn-row">
    <button id="btn-start">▶ Start Detection</button>
    <button id="btn-stop" disabled>■ Stop</button>
  </div>

  <div class="gps-display" id="gps-display">GPS: acquiring…</div>
  <div id="log-feed"></div>
</div>

<script>
  // ─── State ───────────────────────────────────────────────
  let stream = null;
  let captureInterval = null;
  let currentGPS = { lat: 0, lng: 0 };
  let gpsWatchId = null;
  let frameCount = 0;
  let potholeCount = 0;
  let duplicateCount = 0;
  let lastFpsTime = Date.now();
  let fpsFrames = 0;
  let toastTimer = null;

  // Backend URL — same host the page is served from (works for tunnel and localhost)
  const BACKEND = window.location.origin;

  const cam = document.getElementById('cam');
  const canvas = document.getElementById('snapshot');
  const ctx = canvas.getContext('2d');
  const flash = document.getElementById('flash');
  const statusPill = document.getElementById('status-pill');
  const toast = document.getElementById('toast');
  const btnStart = document.getElementById('btn-start');
  const btnStop = document.getElementById('btn-stop');
  const gpsDisplay = document.getElementById('gps-display');
  const logFeed = document.getElementById('log-feed');

  // ─── Toast helper ─────────────────────────────────────────
  function showToast(msg, type = 'saved') {
    if (toastTimer) clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = `show type-${type}`;
    toastTimer = setTimeout(() => { toast.className = ''; }, 3500);
  }

  // ─── Utility ─────────────────────────────────────────────
  function log(msg, type = '') {
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entry.textContent = `[${time}] ${msg}`;
    logFeed.prepend(entry);
    if (logFeed.children.length > 20) logFeed.lastChild.remove();
  }

  function setStatus(text, state = '') {
    statusPill.textContent = text;
    statusPill.className = state ? `active ${state}` : '';
    if (state === 'active') statusPill.classList.add('active');
    if (state === 'error') statusPill.classList.add('error');
  }

  function updateHudTime() {
    const now = new Date();
    document.getElementById('hud-time').textContent =
      now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  setInterval(updateHudTime, 1000);

  // ─── GPS ─────────────────────────────────────────────────
  function startGPS() {
    if (!navigator.geolocation) {
      gpsDisplay.textContent = 'GPS not supported';
      return;
    }
    gpsWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        currentGPS.lat = pos.coords.latitude;
        currentGPS.lng = pos.coords.longitude;
        gpsDisplay.innerHTML =
          `GPS: <span>${currentGPS.lat.toFixed(6)}, ${currentGPS.lng.toFixed(6)}</span>`;
      },
      (err) => {
        gpsDisplay.textContent = `GPS error: ${err.message}`;
        log('GPS unavailable: ' + err.message, 'pothole');
      },
      { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
    );
  }

  function stopGPS() {
    if (gpsWatchId !== null) {
      navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId = null;
    }
  }

  // ─── Camera ──────────────────────────────────────────────
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',  // Rear camera
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });
      cam.srcObject = stream;
      document.getElementById('hud-mode').textContent = 'LIVE — REAR CAM';
      log('Camera started (rear lens)');
    } catch (err) {
      setStatus('CAMERA ERROR', 'error');
      log('Camera error: ' + err.message, 'pothole');
      throw err;
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    cam.srcObject = null;
    document.getElementById('hud-mode').textContent = 'CAMERA OFF';
  }

  // ─── Frame Capture & Upload ───────────────────────────────
  async function captureAndSend() {
    if (!stream || !cam.videoWidth) return;

    // Draw current video frame to canvas
    canvas.width = cam.videoWidth;
    canvas.height = cam.videoHeight;
    ctx.drawImage(cam, 0, 0);

    // Convert to JPEG blob
    canvas.toBlob(async (blob) => {
      if (!blob) return;

      const form = new FormData();
      form.append('frame', blob, 'frame.jpg');
      form.append('lat', currentGPS.lat.toString());
      form.append('lng', currentGPS.lng.toString());

      try {
        const res = await fetch(`${BACKEND}/api/mobile_frame`, {
          method: 'POST',
          body: form,
        });

        if (!res.ok) {
          log(`Server error: ${res.status}`, 'pothole');
          return;
        }

        const data = await res.json();
        frameCount++;
        document.getElementById('stat-frames').textContent = frameCount;

        // FPS calculation
        fpsFrames++;
        const now = Date.now();
        if (now - lastFpsTime >= 2000) {
          const fps = (fpsFrames / ((now - lastFpsTime) / 1000)).toFixed(1);
          document.getElementById('stat-fps').textContent = fps;
          fpsFrames = 0;
          lastFpsTime = now;
        }

        if (data.detections > 0) {
          if (data.duplicate) {
            // Duplicate — show yellow toast, don't increment pothole count
            duplicateCount++;
            document.getElementById('stat-duplicates').textContent = duplicateCount;
            showToast(`⚠ Pothole already reported here (${data.nearby_count} detections at this spot)`, 'duplicate');
            log(`⚠ DUPLICATE — already reported ${data.nearby_count}× at (${data.gps.lat.toFixed(5)}, ${data.gps.lng.toFixed(5)})`, 'duplicate');
          } else {
            potholeCount += data.alerts_saved;
            document.getElementById('stat-potholes').textContent = potholeCount;

            // Flash red border
            flash.classList.add('show');
            setTimeout(() => flash.classList.remove('show'), 300);

            if (data.alerts_saved > 0) {
              showToast(`🚨 New pothole saved to dashboard!`, 'saved');
              log(`🚨 POTHOLE SAVED — GPS: (${data.gps.lat.toFixed(5)}, ${data.gps.lng.toFixed(5)})`, 'pothole');
            } else {
              log(`⚠ Pothole detected (not saved — GPS invalid)`);
            }
          }
        }
      } catch (err) {
        log(`Network error: ${err.message}`, 'pothole');
      }
    }, 'image/jpeg', 0.8);
  }

  // ─── Start / Stop ─────────────────────────────────────────
  btnStart.addEventListener('click', async () => {
    btnStart.disabled = true;
    setStatus('STARTING…', '');

    try {
      await startCamera();
      startGPS();

      // Send a frame every 1.5 seconds
      captureInterval = setInterval(captureAndSend, 1500);
      setStatus('SCANNING', 'active');
      log('Detection started');

      btnStop.disabled = false;
    } catch (err) {
      btnStart.disabled = false;
      setStatus('ERROR', 'error');
    }
  });

  btnStop.addEventListener('click', () => {
    clearInterval(captureInterval);
    captureInterval = null;
    stopCamera();
    stopGPS();
    setStatus('STOPPED', '');
    btnStart.disabled = false;
    btnStop.disabled = true;
    log('Detection stopped');
    document.getElementById('hud-mode').textContent = 'CAMERA OFF';
  });
</script>
</body>
</html>
